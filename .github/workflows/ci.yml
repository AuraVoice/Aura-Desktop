name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - run: npx audit-ci --config ./audit-ci.jsonc

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: cargo check
        working-directory: src-tauri

      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - run: cargo install cargo-audit --locked

      - run: cargo audit
        working-directory: src-tauri

  # Keeps the macOS port compiling from a Windows dev machine: the tauri
  # dependency tree needs a mac toolchain to even type-check, so this job is
  # the only continuous verification until real mac hardware is in the loop.
  rust-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo check
        working-directory: src-tauri
