name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    environment: production
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $versions = [ordered]@{
            "package.json" = $packageVersion
            "src-tauri/tauri.conf.json" = $tauriVersion
            "src-tauri/Cargo.toml" = $cargoVersion
          }
          $mismatches = @($versions.GetEnumerator() | Where-Object { $_.Value -ne $tagVersion })
          if ($mismatches.Count -gt 0) {
            $details = ($versions.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ", "
            throw "Release tag ${{ github.ref_name }} does not match app versions: $details"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing from the production environment."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing from the production environment."
          }

          $probePath = Join-Path $env:RUNNER_TEMP "aura-updater-key-probe.txt"
          Set-Content -LiteralPath $probePath -Value "Aura updater signing key validation" -Encoding utf8
          npm.cmd run tauri signer sign -- $probePath
          if ($LASTEXITCODE -ne 0) {
            throw "The updater private key or password is invalid."
          }

          # A valid key is not necessarily THIS build's key. The pubkey is
          # compiled into the shipped app, so a mismatch here ships updates that
          # every installed client rejects.
          node scripts/verify-updater-key.mjs "$probePath.sig"
          if ($LASTEXITCODE -ne 0) {
            throw "The updater signing key does not match the pubkey in tauri.conf.json."
          }

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify signing certificate profile is reachable
        shell: pwsh
        run: |
          $profileId = "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/Aura/providers/Microsoft.CodeSigning/codeSigningAccounts/aura-signing/certificateProfiles/aura-desktop-public"
          $profileStatus = az resource show --ids $profileId --query "properties.status" -o tsv
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the signing certificate profile. Check AZURE_SUBSCRIPTION_ID and that the service principal holds the Artifact Signing Certificate Profile Signer role on $profileId."
          }
          if ($profileStatus -ne "Active") {
            throw "Signing certificate profile aura-desktop-public is '$profileStatus', not Active."
          }
          Write-Host "Signing certificate profile aura-desktop-public is Active."

      - name: Install Artifact Signing client tools
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "ArtifactSigningClientTools.msi"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/70ad2c3b-761f-4aa9-a9de-e7405aa2b4c1/ArtifactSigningClientTools.msi" -OutFile $installerPath
          $installer = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$installerPath`"", '/quiet', '/norestart')
          if ($installer.ExitCode -ne 0) {
            throw "Artifact Signing client tools installation failed with exit code $($installer.ExitCode)."
          }

          # Searched in order, stopping at the first hit. The MSI installs
          # per-user, so LOCALAPPDATA wins immediately; the Program Files
          # fallbacks only exist to survive another rename like the Trusted to
          # Artifact Signing one, and are scoped to Microsoft* rather than the
          # whole tree. Sweeping all of Program Files and sorting afterwards
          # cost about six minutes a run on a GitHub runner for no extra
          # coverage, since the dlib was always in the first root anyway.
          $searchRoots = @(
            (Join-Path $env:LOCALAPPDATA "Microsoft")
            (Join-Path $env:ProgramFiles "Microsoft*")
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft*")
          )

          $dlib = $null
          foreach ($root in $searchRoots) {
            $dlib = Get-ChildItem -Path $root -Filter Azure.CodeSigning.Dlib.dll -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($dlib) { break }
          }
          if (-not $dlib) {
            throw "Artifact Signing dlib (Azure.CodeSigning.Dlib.dll) was not found under: $($searchRoots -join '; ')."
          }
          $dlibPath = $dlib.FullName
          Write-Host "Using Artifact Signing dlib: $dlibPath"

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "A 64-bit SignTool installation was not found."
          }

          $metadataPath = Join-Path $env:RUNNER_TEMP "aura-signing-metadata.json"
          [ordered]@{
            Endpoint = "https://eus.codesigning.azure.net/"
            CodeSigningAccountName = "aura-signing"
            CertificateProfileName = "aura-desktop-public"
            ExcludeCredentials = @(
              "EnvironmentCredential"
              "WorkloadIdentityCredential"
              "ManagedIdentityCredential"
              "SharedTokenCacheCredential"
              "VisualStudioCredential"
              "VisualStudioCodeCredential"
              "AzurePowerShellCredential"
              "AzureDeveloperCliCredential"
              "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8

          "AURA_SIGNING_METADATA_PATH=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURA_SIGNING_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURA_SIGNING_DLIB_PATH=$dlibPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURA_SIGNING_LOG_PATH=$(Join-Path $env:RUNNER_TEMP 'aura-signing.log')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test the signing command
        shell: pwsh
        env:
          AURA_SIGNING_METADATA_PATH: ${{ env.AURA_SIGNING_METADATA_PATH }}
          AURA_SIGNING_SIGNTOOL_PATH: ${{ env.AURA_SIGNING_SIGNTOOL_PATH }}
          AURA_SIGNING_DLIB_PATH: ${{ env.AURA_SIGNING_DLIB_PATH }}
        run: |
          # Tauri runs the sign command with its output captured and reports
          # only "failed to run powershell.exe", so the real error is invisible
          # and costs a full 12 minute build to reach. Running the same script
          # here, on a throwaway copy of a real PE, surfaces the actual signtool
          # error in the log in seconds and proves Azure signing works before
          # anything expensive starts.
          $sample = Join-Path $env:RUNNER_TEMP "signing-smoke-test.exe"
          Copy-Item -LiteralPath (Get-Command node).Source -Destination $sample -Force

          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows-artifact.ps1 $sample
          if ($LASTEXITCODE -ne 0) {
            throw "Azure signing failed on a sample binary. The signtool error above is the one Tauri hides during bundling."
          }
          Write-Host "Azure signing works. The bundler's sign command should now succeed."

      # The GitHub OIDC token that azure/login exchanges is a client assertion
      # valid for only five minutes, and the Azure CLI keeps re-presenting that
      # same assertion rather than a refresh token. Signing happens inside the
      # bundle phase, twelve minutes into the Rust build, so by the time
      # signtool asked for a token the assertion was long dead:
      #   AADSTS700024: Client assertion is not within its valid time range.
      # Compiling and bundling are therefore split, with a fresh sign-in in
      # between, so signing always runs within a few seconds of a valid
      # assertion. --no-bundle skips the bundle phase, so this step needs no
      # Azure credentials at all.
      - name: Compile the app without bundling
        shell: pwsh
        run: npm.cmd run tauri build -- --no-bundle

      - name: Refresh the Azure sign-in before signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Bundling signs several artifacts in turn (the exe, then the MSI, then
      # the NSIS installer) and can itself run past the five minute assertion
      # window. Signing once here exchanges the fresh assertion for an access
      # token, which is good for about an hour and is cached in the Azure CLI's
      # own token store on disk. Every later signtool call shells out to the
      # same CLI and reuses it, so the assertion only has to be alive for this
      # one signature rather than for the whole bundle phase.
      - name: Warm the signing token cache
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "signing-token-warm.exe"
          Copy-Item -LiteralPath (Get-Command node).Source -Destination $sample -Force

          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows-artifact.ps1 $sample
          if ($LASTEXITCODE -ne 0) {
            throw "Signing failed immediately after a fresh Azure sign-in. The signtool error above is the real cause."
          }

      # Cargo is already up to date from the step above, so this goes almost
      # straight to patching, signing and bundling.
      - name: Bundle and sign without publishing (dry run)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm.cmd run tauri build

      - name: Show what the sign command actually said
        if: failure()
        shell: pwsh
        run: |
          if ($env:AURA_SIGNING_LOG_PATH -and (Test-Path -LiteralPath $env:AURA_SIGNING_LOG_PATH)) {
            Write-Host "----- sign command log -----"
            Get-Content -LiteralPath $env:AURA_SIGNING_LOG_PATH
          } else {
            Write-Host "No sign command log was written, so the failure happened before signing started."
          }

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aura Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false

      - name: Verify release artifacts
        shell: pwsh
        run: |
          # Scoped to the two published installers rather than every .exe under
          # the bundle tree: dictation ships native DLLs and a large model as
          # resources, and a recursive sweep would demand a .sig for files that
          # were never updater artifacts.
          $bundlePath = Join-Path $PWD "src-tauri\target\release\bundle"
          $nsisArtifacts = @(Get-ChildItem -Path (Join-Path $bundlePath "nsis\*.exe") -File -ErrorAction SilentlyContinue)
          $msiArtifacts = @(Get-ChildItem -Path (Join-Path $bundlePath "msi\*.msi") -File -ErrorAction SilentlyContinue)
          if ($nsisArtifacts.Count -eq 0) {
            throw "No NSIS installer was generated under $bundlePath\nsis."
          }
          if ($msiArtifacts.Count -eq 0) {
            throw "No MSI installer was generated under $bundlePath\msi."
          }
          $artifacts = $nsisArtifacts + $msiArtifacts

          foreach ($artifact in $artifacts) {
            & $env:AURA_SIGNING_SIGNTOOL_PATH verify /pa /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($artifact.FullName)."
            }

            $updaterSignaturePath = "$($artifact.FullName).sig"
            if (-not (Test-Path -LiteralPath $updaterSignaturePath -PathType Leaf)) {
              throw "Tauri updater signature was not generated for $($artifact.FullName)."
            }

            Write-Host "Verified signed release artifact: $($artifact.FullName)"
            Write-Host "Verified updater signature: $updaterSignaturePath"
          }

      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
