<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pill debug viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a2e; }
      /* Checkerboard so the pill's real transparent edges are visible against something. */
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .pill-frame {
        width: 280px;
        height: 374px;
        outline: 2px solid #ff2d55;
        background-image:
          linear-gradient(45deg, #333 25%, transparent 25%),
          linear-gradient(-45deg, #333 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #333 75%),
          linear-gradient(-45deg, transparent 75%, #333 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        background-color: #111;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="pill-frame" id="pill-frame">
        <pre id="info" style="position:fixed;top:8px;left:8px;margin:0;padding:8px 12px;background:rgba(0,0,0,0.6);color:#6f6;font:12px/1.5 monospace;white-space:pre;z-index:10;"></pre>
      </div>
    </div>
    <script type="module" src="/src/debug/pillDebug.ts"></script>
  </body>
</html>
