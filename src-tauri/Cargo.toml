[package]
name = "aura-desktop"
version = "0.8.1"
description = "Aura Desktop companion app"
authors = ["Aura"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2.4.3"
tauri-plugin-os = "2.3.2"
xcap = "0.9.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
tauri-plugin-log = "2.8.0"
log = "0.4.33"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# Only for time::sleep in updater.rs's re-check loop - tauri already pulls
# tokio in, this just makes it directly usable.
tokio = { version = "1", features = ["time"] }
# Log redaction rules (redact.rs) - already in the dependency tree
# transitively, this just makes it a direct dependency.
regex = "1"
url = "2"
getrandom = "0.3"
sha2 = "0.10"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# Local dictation's post-decode correction pass (dictation/vocab.rs): phonetic
# aliases via double-metaphone. Pure Rust, no C deps.
rphonetic = "3"

# Win32 bindings - win_focus.rs and the meeting/ module use this, Windows
# only. Scoping it to a target-specific dependency table (rather than
# [dependencies]) keeps it out of a macOS/Linux build entirely, since the
# crate itself only compiles against those platforms' toolchains.
# Feature map: WindowsAndMessaging/KeyboardAndMouse are win_focus, the join
# detector's EnumWindows walk, and the session-watch message window; Threading
# is PID -> exe name; Security_Cryptography is DPAPI key wrapping (its
# LocalAlloc'd output is freed with Foundation's LocalFree); RemoteDesktop is
# the lock/unlock session notifications.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    # Structured screen context (uia/): IUIAutomation lives in Accessibility,
    # its property values come back as VARIANTs, and it is a COM API so the
    # dedicated worker thread needs CoInitializeEx/CoCreateInstance.
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Variant",
    # Persistent Guide Mode capture (guide/capture/dda.rs): DXGI Desktop
    # Duplication needs a D3D11 device, the DXGI factory/adapter/output chain,
    # and DXGI_FORMAT from the Common module.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # "Mute other apps while dictating" (audio_ducking.rs): the WASAPI session
    # API - IAudioSessionManager2, IAudioSessionControl2, ISimpleAudioVolume -
    # is the same mechanism the Windows volume mixer uses for per-app mute.
    "Win32_Media_Audio",
] }
# Meeting capture: WASAPI loopback+mic (wasapi), FLAC container encode
# (flacenc, pure Rust, no C deps - the deliberate codec choice over Opus,
# which would add a cmake/libopus build step and an Ogg muxing layer; see
# MEETING_NOTES_PLAN.md), and AES-256-GCM for segments at rest (aes-gcm's
# default features include getrandom, so key/nonce generation needs no
# separate rand dependency). No resampler crate: both streams are opened in
# shared mode with autoconvert, so the Windows audio engine itself delivers
# 16 kHz mono f32 regardless of the device's native format.
wasapi = "0.23"
flacenc = "0.5"
aes-gcm = "0.10"
# Server-side download of screen-save images for the encrypted local cache
# (saved_images.rs). Rust-side, not a webview fetch, because GCS signed URLs
# send no CORS header - the browser can render them in an <img> but cannot read
# their bytes. rustls-tls keeps it off any native OpenSSL. Windows-only: the
# cache commands no-op on other platforms.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Local dictation's speech recognition (dictation/stt.rs) loads the prebuilt
# CPU-only sherpa-onnx C API at runtime rather than linking it, so the build
# needs no cmake and no C++ toolchain, and the GPU provider DLLs are absent by
# construction. The library and the model are fetched at build time by
# scripts/predownload-dictation-model.mjs and bundled as Tauri resources.
libloading = "0.9"
# Actionable Windows toasts (toast.rs): the notification plugin cannot route a
# toast click on Windows (its action API is mobile-only), this crate can via
# the in-process Activated handler.
tauri-winrt-notification = "0.7"
